version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: docs_db
    environment:
      POSTGRES_DB: docs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docs"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:latest
    container_name: db_migrations
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/main/resources/db/changelog:/liquibase/changelog
    command: >
      --url=jdbc:postgresql://postgres:5432/docs
      --username=postgres
      --password=postgres
      --changeLogFile=/liquibase/changelog/db.changelog-master.xml
      update

volumes:
  postgres_data: